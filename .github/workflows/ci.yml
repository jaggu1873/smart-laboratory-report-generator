name: CI

on:
  push:
  pull_request:

jobs:
  stdlib-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run standard-library tests
        run: python -m unittest discover -s model/tests -v

  prepare-validation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install data-validation dependencies
        run: python -m pip install pandas==2.3.3 PyYAML==6.0.3
      - name: Run data-validation tests
        run: python -m unittest model.tests.test_prepare_validation -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Run Ruff
        run: ruff check model src scripts tests

  compile-ml-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile ML pipeline
        run: python -m compileall src
      - name: Run hydraulic pipeline tests
        run: python -m unittest discover -s tests -v